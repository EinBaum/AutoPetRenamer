name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: AutoPetRenamer
      - name: Package addon
        run: zip -r "AutoPetRenamer-${GITHUB_REF_NAME#v}.zip" AutoPetRenamer -x 'AutoPetRenamer/.git/*' 'AutoPetRenamer/.github/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: AutoPetRenamer-*.zip
          generate_release_notes: true
